<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>manila</title>
  <style>
    :root {
      --bg: #0e0e10;
      --panel: #17171a;
      --panel-2: #1f1f24;
      --border: #2a2a30;
      --fg: #e6e6ea;
      --muted: #8a8a92;
      --accent: #6ad0aa;
      --user: #4a90e2;
      --warn: #f0a832;
      --danger: #e26a6a;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--fg);
      font: 14px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif;
      height: 100%;
    }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    header {
      display: flex; align-items: center; gap: 24px;
      padding: 14px 24px; border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
    header h1 span { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 13px; }
    nav { display: flex; gap: 4px; }
    nav button {
      background: transparent; border: 1px solid transparent;
      color: var(--muted); padding: 6px 14px; border-radius: var(--radius);
      cursor: pointer; font: inherit; font-weight: 500;
    }
    nav button:hover { color: var(--fg); }
    nav button.active { background: var(--panel-2); color: var(--fg); border-color: var(--border); }

    main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .view { display: none; flex: 1; flex-direction: column; min-height: 0; }
    .view.active { display: flex; }

    /* CHAT */
    #chat-view { padding: 0; }
    #messages {
      flex: 1; overflow-y: auto; padding: 24px;
      display: flex; flex-direction: column; gap: 16px;
      max-width: 760px; width: 100%; margin: 0 auto;
    }
    .msg { display: flex; flex-direction: column; gap: 8px; }
    .msg-bubble {
      padding: 12px 16px; border-radius: var(--radius);
      white-space: pre-wrap; word-wrap: break-word;
    }
    .msg.user .msg-bubble { background: var(--user); align-self: flex-end; max-width: 80%; }
    .msg.assistant .msg-bubble { background: var(--panel-2); border: 1px solid var(--border); }
    .msg.error .msg-bubble { background: rgba(226, 106, 106, 0.15); border: 1px solid var(--danger); }
    .msg-citations { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .citation {
      font-size: 12px; padding: 8px 10px; background: var(--panel);
      border: 1px solid var(--border); border-radius: 6px; color: var(--muted);
    }
    .citation-id { color: var(--accent); font-weight: 600; margin-right: 8px; }
    .citation-content { color: var(--fg); }
    .citation-source { display: block; margin-top: 4px; font-style: italic; color: var(--muted); font-size: 11px; }
    .empty {
      text-align: center; color: var(--muted); padding: 64px 24px;
      font-size: 13px;
    }
    .empty h2 { font-size: 16px; color: var(--fg); margin: 0 0 8px; font-weight: 500; }

    #chat-form {
      display: flex; gap: 8px; padding: 16px 24px;
      border-top: 1px solid var(--border); background: var(--panel);
      max-width: 760px; width: 100%; margin: 0 auto;
    }
    #question {
      flex: 1; padding: 10px 14px; border-radius: var(--radius);
      background: var(--panel-2); border: 1px solid var(--border); color: var(--fg);
      font: inherit;
    }
    #question:focus { outline: none; border-color: var(--accent); }
    #chat-form button {
      padding: 10px 20px; border-radius: var(--radius);
      background: var(--accent); color: #0e0e10; border: none; font: inherit; font-weight: 600;
      cursor: pointer;
    }
    #chat-form button:disabled { opacity: 0.5; cursor: not-allowed; }
    .typing { color: var(--muted); font-style: italic; }

    /* FACTS */
    #facts-view { padding: 24px; max-width: 1200px; margin: 0 auto; width: 100%; }
    .filters {
      display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .filters input, .filters select {
      padding: 8px 12px; border-radius: var(--radius);
      background: var(--panel-2); border: 1px solid var(--border); color: var(--fg);
      font: inherit;
    }
    .filters input { flex: 1; min-width: 200px; }
    #facts-summary { color: var(--muted); margin-bottom: 12px; font-size: 13px; }
    .fact {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 16px; margin-bottom: 8px;
    }
    .fact-header {
      display: flex; gap: 12px; align-items: center;
      font-size: 12px; color: var(--muted); margin-bottom: 6px;
    }
    .fact-id { color: var(--accent); font-weight: 600; }
    .fact-category {
      padding: 2px 8px; border-radius: 4px; background: var(--panel-2);
      text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em;
    }
    .fact-confidence-bar {
      display: inline-block; width: 60px; height: 4px;
      background: var(--border); border-radius: 2px; overflow: hidden;
    }
    .fact-confidence-bar > span { display: block; height: 100%; background: var(--accent); }
    .fact-subject { color: var(--fg); font-weight: 500; }
    .fact-content { color: var(--fg); margin: 4px 0; }
    .fact-source {
      font-size: 12px; color: var(--muted); margin-top: 6px;
      padding-top: 6px; border-top: 1px solid var(--border); font-style: italic;
    }
  </style>
</head>
<body>
  <header>
    <h1>manila <span>your memory</span></h1>
    <nav>
      <button data-view="chat" class="active">Chat</button>
      <button data-view="facts">Facts</button>
    </nav>
  </header>

  <main>
    <section id="chat-view" class="view active">
      <div id="messages">
        <div class="empty">
          <h2>Ask anything about your contacts</h2>
          <p>"What did Emma tell me about her family?"<br>"When did she mention a trip?"</p>
        </div>
      </div>
      <form id="chat-form">
        <input type="text" id="question" placeholder="Ask a question..." autocomplete="off" />
        <button type="submit">Ask</button>
      </form>
    </section>

    <section id="facts-view" class="view">
      <div class="filters">
        <input type="text" id="filter-q" placeholder="Search content..." />
        <input type="text" id="filter-subject" placeholder="Subject (e.g. Emma)" />
        <select id="filter-category"><option value="">All categories</option></select>
      </div>
      <div id="facts-summary"></div>
      <div id="facts-list"></div>
    </section>
  </main>

  <script>
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    // ---- view switching ----
    $$('nav button').forEach((btn) => {
      btn.addEventListener('click', () => {
        $$('nav button').forEach((b) => b.classList.toggle('active', b === btn));
        $$('.view').forEach((v) => v.classList.toggle('active', v.id === btn.dataset.view + '-view'));
        if (btn.dataset.view === 'facts') loadFacts();
      });
    });

    // ---- chat ----
    const messagesEl = $('#messages');
    const form = $('#chat-form');
    const input = $('#question');
    const sendBtn = form.querySelector('button');

    function renderMsg(role, text, citations) {
      const empty = messagesEl.querySelector('.empty');
      if (empty) empty.remove();

      const wrap = document.createElement('div');
      wrap.className = 'msg ' + role;

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = text;
      wrap.appendChild(bubble);

      if (citations && citations.length) {
        const cWrap = document.createElement('div');
        cWrap.className = 'msg-citations';
        for (const c of citations) {
          const cit = document.createElement('div');
          cit.className = 'citation';
          const ts = new Date(c.source_ts * 1000).toLocaleString();
          cit.innerHTML = `
            <span class="citation-id">[fact:${c.id}]</span>
            <span class="citation-content"></span>
            <span class="citation-source"></span>
          `;
          cit.querySelector('.citation-content').textContent = c.content;
          cit.querySelector('.citation-source').textContent =
            `→ "${c.source_body}" (${c.source_direction === 'out' ? 'me' : 'them'}, ${ts})`;
          cWrap.appendChild(cit);
        }
        wrap.appendChild(cWrap);
      }

      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return wrap;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      input.value = '';
      sendBtn.disabled = true;

      renderMsg('user', question);
      const typing = renderMsg('assistant', '…');
      typing.querySelector('.msg-bubble').classList.add('typing');

      try {
        const r = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const data = await r.json();
        typing.remove();
        if (!r.ok) throw new Error(data.error || 'request failed');
        renderMsg('assistant', data.answer || '(empty answer)', data.citations);
      } catch (err) {
        typing.remove();
        renderMsg('error', err.message);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    // ---- facts ----
    const factsListEl = $('#facts-list');
    const factsSummaryEl = $('#facts-summary');
    const filterQ = $('#filter-q');
    const filterSubject = $('#filter-subject');
    const filterCategory = $('#filter-category');

    let factsLoadTimer;
    [filterQ, filterSubject, filterCategory].forEach((el) => {
      el.addEventListener('input', () => {
        clearTimeout(factsLoadTimer);
        factsLoadTimer = setTimeout(loadFacts, 200);
      });
    });

    let categoriesPopulated = false;

    async function loadFacts() {
      const params = new URLSearchParams();
      if (filterQ.value.trim()) params.set('q', filterQ.value.trim());
      if (filterSubject.value.trim()) params.set('subject', filterSubject.value.trim());
      if (filterCategory.value) params.set('category', filterCategory.value);

      factsSummaryEl.textContent = 'loading...';
      try {
        const r = await fetch('/api/facts?' + params.toString());
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'request failed');

        if (!categoriesPopulated && data.categories.length) {
          for (const cat of data.categories) {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            filterCategory.appendChild(opt);
          }
          categoriesPopulated = true;
        }

        renderFacts(data.facts);
      } catch (err) {
        factsSummaryEl.textContent = 'error: ' + err.message;
        factsListEl.innerHTML = '';
      }
    }

    function renderFacts(facts) {
      factsSummaryEl.textContent = `${facts.length} facts`;
      if (!facts.length) {
        factsListEl.innerHTML = '<div class="empty"><h2>No facts match your filters</h2></div>';
        return;
      }

      factsListEl.innerHTML = '';
      for (const f of facts) {
        const el = document.createElement('div');
        el.className = 'fact';
        const ts = new Date(f.source_ts * 1000).toLocaleString();
        const conf = Math.round(f.confidence * 100);
        el.innerHTML = `
          <div class="fact-header">
            <span class="fact-id">#${f.id}</span>
            <span class="fact-category">${escapeHtml(f.category)}</span>
            <span class="fact-subject">about: <strong></strong></span>
            <span class="fact-confidence-bar"><span style="width:${conf}%"></span></span>
            <span>${conf}%</span>
          </div>
          <div class="fact-content"></div>
          <div class="fact-source"></div>
        `;
        el.querySelector('.fact-subject strong').textContent = f.subject_wa_id;
        el.querySelector('.fact-content').textContent = f.content;
        el.querySelector('.fact-source').textContent =
          `from ${f.source_direction === 'out' ? 'me' : 'them'} on ${ts}: "${f.source_body}"`;
        factsListEl.appendChild(el);
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    // initial focus
    input.focus();
  </script>
</body>
</html>
